name: Deploy Workers

# Deploys the Cloudflare Workers (tail, api, ingest, mcp, webhooks, lifecycle)
# with Wrangler. The Next.js dashboard is deployed separately.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/ingest/**"
      - "apps/mcp/**"
      - "apps/webhooks/**"
      - "apps/lifecycle/**"
      - "apps/tail/**"
      - "packages/core/**"
      - "packages/db/**"
      - "packages/observability/**"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "Which worker to deploy"
        type: choice
        default: all
        options: [all, tail, api, ingest, mcp, webhooks, lifecycle]

# Never run two deploys of the same ref at once; let an in-flight deploy finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate deploys on a clean typecheck + test run so we never ship broken code.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    strategy:
      # Tail Worker first (producers reference it). One failure shouldn't block others.
      fail-fast: false
      matrix:
        include:
          - worker: tail
            order: 1
          - worker: api
            order: 2
          - worker: ingest
            order: 2
          - worker: mcp
            order: 2
          - worker: webhooks
            order: 2
          - worker: lifecycle
            order: 2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Skip workers not selected in a manual (workflow_dispatch) run.
      - name: Should this worker deploy?
        id: gate
        run: |
          want='${{ github.event.inputs.worker }}'
          if [ -z "$want" ] || [ "$want" = "all" ] || [ "$want" = "${{ matrix.worker }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.worker }} (dispatch selected: $want)"
          fi

      - name: Deploy ${{ matrix.worker }}
        if: steps.gate.outputs.run == 'true'
        run: bun run --filter @betterflag/${{ matrix.worker }} deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
