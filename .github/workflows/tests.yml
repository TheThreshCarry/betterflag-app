name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Fail if any app's version.gen.ts drifted from its package.json version.
      - run: bun run version:check
      - run: bun run typecheck
      - run: bun run test
